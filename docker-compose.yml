services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: log-monitor-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - DOCKER_HOST=unix:///var/run/docker.sock
    expose:
      - "8080"
    networks:
      - default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: log-monitor
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
      - rede-proxy

networks:
  rede-proxy:
    external: true
